<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOZIAR FIT</title>

    <!-- ZEWNĘTRZNE SKRYPTY / BIBLIOTEKI -->
    <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- TWÓJ STYL ZEWNĘTRZNY -->
    <link rel="stylesheet" href="style_3.css">
</head>
<body>

    <!-- NAGŁÓWEK -->
    <header>
        <div class="brand-logo" onclick="secretAdminPrompt()" title="Kliknij, aby podać PIN">KOZIAR <span>FIT</span></div>
        
        <div class="header-controls">
            <select id="planSelect" onchange="loadPlan()"></select>
            <button class="btn-icon" onclick="deleteCurrentPlan()" title="Usuń plan">
                <i data-lucide="trash-2" style="width:18px; height:18px;"></i>
            </button>
        </div>
    </header>

    <!-- KONTENER GŁÓWNY -->
    <main>
        <!-- NOTATKI -->
        <div class="notes-area">
            <label>Notatki Trenera / Uwagi</label>
            <textarea id="planNotes" placeholder="Treść notatek..." onchange="saveNotes()"></textarea>
        </div>

        <!-- WIDOK PLANU -->
        <div id="gymView"></div>

        <!-- EDYTOR EXCEL -->
        <div id="editArea" style="display:none;">
            <div id="excelContainer"></div>
        </div>
    </main>

    <!-- NAV BAR MOBILNY -->
    <nav class="bottom-nav">
        <button class="nav-btn" id="btnToggleMode" onclick="toggleViewMode()">
            <i data-lucide="check-square"></i>
            <span>BASIC / PRO</span>
        </button>

        <button class="nav-btn" onclick="setMode('edit')">
            <i data-lucide="edit-3"></i>
            <span>EDYTUJ</span>
        </button>

        <button class="nav-btn" onclick="newPlan()">
            <i data-lucide="plus-circle"></i>
            <span>NOWY</span>
        </button>

        <button class="nav-btn" onclick="openImport()">
            <i data-lucide="download"></i>
            <span>DODAJ / KOD</span>
        </button>

        <button class="nav-btn" onclick="openExport()">
            <i data-lucide="share-2"></i>
            <span>UDOSTĘPNIJ</span>
        </button>
    </nav>

    <!-- MODALE -->
    <div id="importModal" class="modal">
        <div class="modal-box">
            <h3>Dodaj Plan lub Kod</h3>
            <p style="font-size:11px; color:var(--text-dim); text-align:center;">Wpisz Kod Dostępu od Trenera, PIN Admina lub wklej plan.</p>
            <textarea id="importInputVal" placeholder="Kod planu / PIN / Treść..."></textarea>
            <input type="file" id="fileInput" onchange="handleFileSelect(event)" style="font-size: 11px;">
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="handleImportOrKey()">Zatwierdź</button>
                <button class="btn" onclick="closeModals()">Zamknij</button>
            </div>
        </div>
    </div>

    <div id="exportModal" class="modal">
        <div class="modal-box">
            <h3>Udostępnij Plan</h3>
            <p id="exportKeyInfo" style="font-weight:bold; color:var(--gold); font-size:12px; text-align:center;"></p>
            <textarea id="exportText" readonly></textarea>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="setPlanAccessKey()">Nadaj Kod (Trener)</button>
                <button class="btn" onclick="downloadTSV()">Pobierz TSV</button>
                <button class="btn" onclick="closeModals()">Zamknij</button>
            </div>
        </div>
    </div>

    <!-- LOGIKA ZEWNĘTRZNA -->
    <script src="script.js"></script>
</body>
</html>
