<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trening Koziar</title>
    <!-- Twoje istniejące CSS, Handsontable, Lucide Icons -->
</head>
<body>

    <!-- NAGŁÓWEK -->
    <header class="app-header">
        <!-- Kliknięcie w nazwę aktywuje wpisanie PINu Admina! -->
        <h1 class="brand-logo" title="Kliknij, aby podać PIN">KOZIAR <span>FIT</span></h1>
        
        <div class="header-controls">
            <select id="planSelect" onchange="loadPlan()"></select>
            <button class="btn-icon btn-danger" onclick="deleteCurrentPlan()" title="Usuń Plan">
                <i data-lucide="trash-2"></i>
            </button>
        </div>
    </header>

    <!-- KONTENER GŁÓWNY -->
    <main class="container">
        <!-- NOTATKI -->
        <div class="notes-card">
            <textarea id="planNotes" placeholder="Notatki do planu..." onchange="saveNotes()"></textarea>
        </div>

        <!-- WIDOK PLANU -->
        <div id="gymView"></div>

        <!-- WIDOK EXCELA (EDYCJA) -->
        <div id="editArea" style="display:none;">
            <div id="excelContainer"></div>
        </div>
    </main>

    <!-- DOLNA NAWIGACJA MOBILNA -->
    <nav class="bottom-nav">
        <!-- Jeden przycisk do przełączania trybów BASIC / PRO -->
        <button class="nav-btn" id="btnToggleMode" onclick="toggleViewMode()">
            <i data-lucide="check-square"></i><span>BASIC / PRO</span>
        </button>

        <button class="nav-btn" onclick="setMode('edit')">
            <i data-lucide="edit-3"></i><span>EDYTUJ</span>
        </button>

        <button class="nav-btn" onclick="newPlan()">
            <i data-lucide="plus-circle"></i><span>NOWY</span>
        </button>

        <button class="nav-btn" onclick="openImport()">
            <i data-lucide="download"></i><span>DODAJ / KOD</span>
        </button>

        <button class="nav-btn" onclick="openExport()">
            <i data-lucide="share-2"></i><span>UDOSTĘPNIJ</span>
        </button>
    </nav>

    <!-- MODAL IMPORTU / KODU -->
    <div id="importModal" class="modal">
        <div class="modal-content">
            <h3>Wprowadź Kod lub Plik Planu</h3>
            <p style="font-size: 12px; color: #888;">Wpisz Kod Planu od Trenera, PIN Admina lub wklej treść planu.</p>
            
            <textarea id="importInputVal" placeholder="Kod planu / PIN / Treść TSV..."></textarea>
            
            <input type="file" id="fileInput" onchange="handleFileSelect(event)" style="margin: 10px 0;">
            
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="handleImportOrKey()">Zatwierdź</button>
                <button class="btn" onclick="closeModals()">Zamknij</button>
            </div>
        </div>
    </div>

    <!-- MODAL EKSPORTU I NADAWANIA KODU -->
    <div id="exportModal" class="modal">
        <div class="modal-content">
            <h3>Udostępnianie i Eksport</h3>
            <p id="exportKeyInfo" style="font-weight: bold; color: #4F46E5;"></p>
            
            <textarea id="exportText" readonly></textarea>
            
            <div class="modal-actions" style="flex-wrap: wrap; gap: 8px;">
                <button class="btn btn-primary" onclick="setPlanAccessKey()">Nadaj Kod (Trener)</button>
                <button class="btn" onclick="downloadTSV()">Pobierz TSV</button>
                <button class="btn" onclick="closeModals()">Zamknij</button>
            </div>
        </div>
    </div>

</body>
</html>
